name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install libvips with HEIF/AVIF support
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips libvips-tools libheif1 libheif-dev libheif-plugin-aomenc libheif-plugin-libde265

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build and publish gem to RubyGems
        uses: rubygems/release-gem@v1
